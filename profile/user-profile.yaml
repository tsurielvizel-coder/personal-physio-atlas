# פרופיל מתאמן - מאגר פיזיותרפיה, קליסתניקס ומוכנות למילואים
version: "1.0.0"
updated_at: "2026-11-20"

trainee:
  age: 28
  sex: "male"
  weight_status: "normal"
  general_health: "healthy"
  occupation: "sedentary_desk_work"
  goals:
    - "מניעת כאבי גב תחתון והגנה בעומסי יומיום וישיבה ממושכת"
    - "איזון אסימטריה קלה בעמוד השדרה (עקמת קלה)"
    - "התאוששות מנשיאת אקדח בהליכה ממושכת ומניעת הישנות"
    - "הכנת הגב והגוף לשירות מילואים בעוד מספר חודשים"
    - "הגברת חיוניות, ערנות ואנרגיה יומית"

clinical_context:
  scoliosis: "mild_adult"
  pain_pattern: "pain-free when consistent with baseline routine + swimming; recent flare-up triggered by prolonged walking while carrying a handgun"
  red_flags_present: false
  spine_strategy:
    - "McGill Big 3 core stiffness & endurance (neutral spine)"
    - "Unilateral symmetry monitoring (<=15% gap early, <=10% advanced)"
    - "Anti-lateral flexion & anti-rotation conditioning (Suitcase/Waiter carries)"
    - "Safe replacement of supine double straight-leg raises with Dead Bug / Hollow progressions"

current_baseline_routine:
  swimming:
    style: "freestyle"
    duration_min: 30
    frequency_per_week: 1
  floor_core_routine:
    frequency_per_week: 3
    sets: 3
    exercises:
      - name: "סופרמן בעמידת 6 (Bird-Dog)"
        current_dose: "12 חזרות לכל יד/רגל נגדית"
        clinical_note: "מצוין - לשדרג לעצירת 3-5 שניות בקצה עם אגרוף קמוץ ועמוד שדרה ניטרלי"
      - name: "בטן סטטית (Plank)"
        current_dose: "35 שניות"
        clinical_note: "טוב מאוד - להקפיד על כיווץ ישבן ולדחוף את המרפקים לכיוון הבהונות (RKC)"
      - name: "קוברה (Cobra / Prone Extension)"
        current_dose: "10 שניות"
        clinical_note: "להשאיר כהרפיה עדינה בלבד ללא לחץ חד בגב תחתון"
      - name: "הרמות רגליים בשכיבה על הגב עם ידיים מתחת לטוסיק"
        current_dose: "12 חזרות"
        clinical_note: "מוחלף בהדרגה ל-Dead Bug / שליטה בחד-רגלי למניעת כוח גזירה קדמי מהפסואס (McGill)"
      - name: "הרמות אגן על הצד (Side Hip Raises)"
        current_dose: "12 חזרות לכל צד"
        clinical_note: "לשדרג לפלאנק צידי מלא/דינמי עם ספירה זהה לשמאל ולימין (נשק נגד אקדח ועקמת)"

time_budget_addition:
  busy_week_mode: "+30 min/week (3 x 10 min stacked after core routine, or 2 x 15 min)"
  optimal_week_mode: "+60 min/week (3 x 20 min total addition, or 2 x 25 min + 10 min carry/ruck)"
  emergency_habit_saver: "5 min minimum dose ('Don't miss twice')"

equipment_available:
  home:
    - "bodyweight & floor mat"
    - "backpack with water bottles / books (4-20 kg)"
    - "sturdy chair / table / doorframe towel"
  optional_park:
    - "pull-up bar & parallel bars / low bar"

progression_tracking:
  current_stage: 1
  total_stages: 10
  placement_completed: false
  miluim_target_months: 3-4
